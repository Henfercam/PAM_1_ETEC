<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Carrinho de Compras</h1>


    <select id="filtro">
        <option value="tudos">Tudo</option>
        <option value="menos100">R$0 - R$100</option>
        <option value="mais100">R$100 - R$250</option>
    </select>



    <div class="container">

        <div class="produtos">
            <h2>Produtos</h2>

            <div id="lista-produtos"></div>
        </div>





        <div class="carrinho">
            <h2>Carrinho</h2>

            <div id="lista-carrinho"></div>

            <h3 id="total">Carrinho Vazio</h3>

            <button id="limpar">
                Limpar Carrinho
            </button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
